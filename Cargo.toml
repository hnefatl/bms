[package]
name = "bms"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
async-channel = "2.5"
async-trait = "0.1"
rumqttc = "0.25"
bytes = "1"
regex = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-fsm = { git = "https://github.com/hnefatl/rust-fsm", features = ["diagram"] }
